button:focus-visible,input:focus-visible{outline:3px solid var(--gold-l); outline-offset:2px}

footer{text-align:center; font-size:15.5px; color:var(--ink2); margin-top:26px}

@media (max-width:480px){ body{font-size:17px} .frame{padding:18px 10px 22px} .chap{padding:16px 14px} .ctitle h3{font-size:16px} .seal{width:46px;height:46px;font-size:15px} .vol input{width:80px} }

<script>
const DATA = {"es": [{"n": "", "h": "Introducción", "p": "Bienvenidos a la audioguía del cartel «Cádiz: la gran ruta del comercio global». Entre 1262 y 1503, Cádiz pasó de ser una plaza de frontera en el Estrecho a uno de los puertos que unían el Mediterráneo, el Atlántico y, al final, América.", "f": "es_0.mp3", "d": 15.6}, {"n": "I", "h": "Ferias y privilegios", "p": "Hacia 1262, Alfonso X incorpora Cádiz a Castilla. Quería convertirla en base naval hacia el norte de África, y para atraer pobladores y comercio le concedió en 1263 una feria anual y la exención del portazgo, el impuesto por entrar mercancías. En 1310, Fernando IV liberó de diezmos, alcabalas y peajes todo lo que llegaba por tierra y mar. La Corona usaba los impuestos como reclamo para los mercaderes.", "f": "es_1.mp3", "d": 29.1}, {"n": "II", "h": "La escala de Sevilla y Jerez", "p": "Sevilla era el gran centro de negocios, pero remontar el Guadalquivir era lento para los barcos grandes. Por eso Cádiz servía de escala, donde se cargaba y almacenaba la mercancía. Jerez abastecía de cereal a la ciudad, y del norte peninsular llegaban barcos y marineros vizcaínos.", "f": "es_2.mp3", "d": 18.2}, {"n": "III", "h": "Escala entre dos mares", "p": "Desde 1277, las naves genovesas empiezan a viajar por mar hasta Brujas, cruzando el Estrecho, y Cádiz se convierte en su escala. Las galeras venecianas de Flandes también fondeaban aquí antes de seguir hacia Inglaterra. Aquellos barcos necesitaban agua, víveres y reparaciones. En 1394 llegaban paños ingleses desde Southampton, y en el siglo XV se asienta en la ciudad una comunidad genovesa.", "f": "es_3.mp3", "d": 27.8}, {"n": "IV", "h": "Oro, atún y Berbería", "p": "Los genoveses buscaban sobre todo oro africano, que cruzaba el Sáhara y llegaba a Tánger, Arcila o Salé, y de allí pasaba por Cádiz hacia Italia. Con él venían cueros, cera, miel y también personas esclavizadas. El producto local era el atún de las almadrabas, convertido en salazón y mojama. Era un comercio arriesgado, que a menudo viajaba con escolta armada. En 1493, los Reyes Católicos dieron a Cádiz la exclusiva del comercio con Berbería.", "f": "es_4.mp3", "d": 29.3}, {"n": "✦", "h": "La rosa de los mares", "p": "En el centro del cartel, Cádiz aparece dentro de una rosa de los vientos, el símbolo de las cartas náuticas de la época. Cada punta lleva a un mercado: Inglaterra y Flandes, con sus paños; el norte peninsular, con barcos y marineros; Sevilla y Jerez, con dinero y trigo; Génova e Italia, compradoras de oro y atún; el Magreb, con el oro africano; y Canarias y Madeira, con azúcar y tintes. La última flecha, el segundo viaje de Colón, apunta a las Indias. Cádiz era un centro de distribución: su ubicación le permitía conectar mercados lejanos.", "f": "es_5.mp3", "d": 32.0}, {"n": "V", "h": "Colón y las Indias", "p": "Entre 1489 y 1491, Colón vivió en El Puerto de Santa María, protegido por el duque de Medinaceli, en una bahía llena de barcos y pilotos. Su primer viaje salió de Palos, pero el segundo zarpó de Cádiz el 25 de septiembre de 1493: diecisiete barcos y unas mil quinientas personas, con caballos, ganado y semillas. Ya no era una exploración: era la primera gran expedición para poblar y comerciar en América.", "f": "es_6.mp3", "d": 29.6}, {"n": "VI", "h": "La primera imagen de América", "p": "La nao Santa María era de Juan de la Cosa, un marino cántabro vecino de El Puerto, que viajaba como su maestre. En 1500, en esta bahía, dibujó el mapa más antiguo conservado en el que aparece América, y lo firmó en el Puerto de Santa María. El original se conserva en el Museo Naval de Madrid.", "f": "es_7.mp3", "d": 18.8}, {"n": "", "h": "Cierre: 1503", "p": "En 1503, los Reyes Católicos crean en Sevilla la Casa de Contratación para controlar el comercio con América. Siglos después, en 1717, se trasladaría a Cádiz. Así, la ciudad pasó de vigilar el Estrecho a formar parte de la gran ruta del comercio global. Gracias por escuchar.", "f": "es_8.mp3", "d": 18.1}], "en": [{"n": "", "h": "Introduction", "p": "Welcome to the audio guide for the poster “Cádiz: the Great Route of Global Trade”. Between 1262 and 1503, Cádiz went from a frontier town on the Strait to one of the ports linking the Mediterranean, the Atlantic and, in the end, America.", "f": "en_0.mp3", "d": 16.7}, {"n": "I", "h": "Fairs and privileges", "p": "Around 1262, Alfonso X brought Cádiz into Castile. He wanted a naval base facing North Africa, and to attract settlers and trade he granted it, in 1263, an annual fair and an exemption from the portazgo, the toll on incoming goods. In 1310, Fernando IV freed everything arriving by land and sea from tithes, sales taxes and tolls. The Crown was using tax breaks to attract merchants.", "f": "en_1.mp3", "d": 27.5}, {"n": "II", "h": "The port of call for Seville and Jerez", "p": "Seville was the great business centre, but sailing up the Guadalquivir was slow for large ships. So Cádiz served as the port of call, where goods were loaded and stored. Jerez supplied the city with grain, and ships and Basque sailors came from northern Spain.", "f": "en_2.mp3", "d": 18.6}, {"n": "III", "h": "A stopover between two seas", "p": "From 1277, Genoese ships began sailing all the way to Bruges, through the Strait, and Cádiz became their stopover. Venice's Flanders galleys also anchored here before heading on to England. Those ships needed water, food and repairs. In 1394 English cloth was arriving from Southampton, and in the fifteenth century a Genoese community settled in the city.", "f": "en_3.mp3", "d": 25.6}, {"n": "IV", "h": "Gold, tuna and Barbary", "p": "Above all, the Genoese wanted African gold, which crossed the Sahara to Tangier, Asilah or Salé, and passed through Cádiz on its way to Italy. With it came hides, wax, honey and also enslaved people. The local product was tuna from the traps of the Strait, salted or dried into mojama. It was a risky trade that often sailed under armed escort. In 1493 the Catholic Monarchs gave Cádiz the exclusive right to trade with Barbary.", "f": "en_4.mp3", "d": 27.9}, {"n": "✦", "h": "The rose of the seas", "p": "At the centre of the poster, Cádiz sits inside a compass rose, the symbol of the nautical charts of the time. Each point leads to a market: England and Flanders, with their cloth; northern Spain, with ships and sailors; Seville and Jerez, with money and grain; Genoa and Italy, buyers of gold and tuna; the Maghreb, with African gold; and the Canaries and Madeira, with sugar and dyes. The last arrow, Columbus's second voyage, points to the Indies. Cádiz was a distribution hub: its location let it connect distant markets.", "f": "en_5.mp3", "d": 33.5}, {"n": "V", "h": "Columbus and the Indies", "p": "Between 1489 and 1491, Columbus lived in El Puerto de Santa María, under the protection of the Duke of Medinaceli, in a bay full of ships and pilots. His first voyage left from Palos, but the second sailed from Cádiz on 25 September 1493: seventeen ships and around fifteen hundred people, with horses, livestock and seeds. This was no longer exploration: it was the first great expedition to settle and trade in America.", "f": "en_6.mp3", "d": 32.3}, {"n": "VI", "h": "The first image of America", "p": "The Santa María belonged to Juan de la Cosa, a Cantabrian sailor living in El Puerto, who sailed as her master. In 1500, in this bay, he drew the oldest surviving map to show America, and signed it in El Puerto de Santa María. The original is kept in the Naval Museum in Madrid.", "f": "en_7.mp3", "d": 20.7}, {"n": "", "h": "Closing: 1503", "p": "In 1503 the Catholic Monarchs created the Casa de Contratación in Seville to control trade with America. Centuries later, in 1717, it would move to Cádiz. So the city went from guarding the Strait to becoming part of the great route of global trade. Thank you for listening.", "f": "en_8.mp3", "d": 18.9}]};

  en:{name:"English", sub:"Audio guide to the poster · From the frontier of the Strait to the Atlantic opening", playall:"Listen to the audio guide", total:"9 chapters · ", rose:"The rose of the seas", rosehint:"Tap a market to see what reached Cádiz from there",
      marketDefault:"Cádiz, at the centre, linked seven markets. Tap any of them.", now:"Chapter", nowNone:"Choose a chapter or press “Listen”", play:"Play", pause:"Pause", prev:"Previous chapter", next:"Next chapter",
      seek:"Audio position", speed:"Speed", vol:"Volume", mute:"Mute", unmute:"Unmute", volnote:"Volume: use your phone's buttons", chplay:"Listen", missing:"The audio for this chapter could not be loaded.",
      byline:"CREATED BY", course:"Double Degree in Business + Finance · Marketing Management · University of Cádiz", credit:"AI-generated synthetic narration (Kokoro-82M, Apache 2.0 licence). Website partly made with AI.", group:"Language", min:"min"}
};
const MARKETS = [
  {id:"norte", ang:-90, es:["Norte peninsular","Norte peninsular","Barcos y marineros de Vizcaya y Guipúzcoa, donde se construían muchas de las naos del Atlántico."], en:["Northern Spain","Northern Spain","Ships and sailors from Biscay and Gipuzkoa, where many Atlantic ships were built."]},
  {id:"sevilla", ang:-38, es:["Sevilla y Jerez","Sevilla y Jerez","Sevilla ponía los mercaderes y el dinero; Jerez, el cereal. Cádiz era su escala en el mar."], en:["Seville and Jerez","Seville and Jerez","Seville provided the merchants and the money; Jerez, the grain. Cádiz was their port of call."]},
  {id:"genova", ang:13, es:["Génova e Italia","Génova e Italia","Desde 1277, escala de las naves genovesas. Compraban oro, atún y mojama."], en:["Genoa and Italy","Genoa and Italy","From 1277, a stopover for Genoese ships. They bought gold, tuna and mojama."]},
  {id:"magreb", ang:90, es:["Magreb occidental","Magreb occidental","Tánger, Arcila y Salé: oro africano, cueros, cera y miel. En 1493 Cádiz obtiene la exclusiva de este comercio."], en:["Western Maghreb","Western Maghreb","Tangier, Asilah and Salé: African gold, hides, wax and honey. In 1493 Cádiz won the exclusive right to this trade."]},
  {id:"canarias", ang:150, es:["Canarias y Madeira","Canarias y Madeira","Nuevos mercados atlánticos: azúcar de Madeira y orchilla, un tinte, de Canarias."], en:["Canaries and Madeira","Canaries and Madeira","New Atlantic markets: sugar from Madeira and orchil, a dye, from the Canaries."]},
  {id:"indias", ang:180, es:["Indias (1493)","Indias (1493)","El 25 de septiembre de 1493 sale de Cádiz el segundo viaje de Colón, con 17 barcos y unas 1.500 personas."], en:["Indies (1493)","Indies (1493)","On 25 September 1493 Columbus's second voyage sails from Cádiz, with 17 ships and around 1,500 people."]},
  {id:"inglaterra", ang:-142, es:["Inglaterra y Flandes","Inglaterra y Flandes","Paños ingleses y flamencos. Las galeras italianas paraban en Cádiz camino de Brujas y Southampton."], en:["England and Flanders","England and Flanders","English and Flemish cloth. Italian galleys stopped at Cádiz on their way to Bruges and Southampton."]}
];

const $ = id => document.getElementById(id);
const audio = $("audio");
let lang = "es", cur = -1, seeking = false, rate = 1;
const RATES = [0.75, 1, 1.25, 1.5];
const fmt = s => { if(!isFinite(s)) return "0:00"; s = Math.max(0, Math.round(s)); return Math.floor(s/60) + ":" + String(s%60).padStart(2,"0"); };
const store = (k,v) => { try{ localStorage.setItem(k,v); }catch(e){} };
const load = k => { try{ return localStorage.getItem(k); }catch(e){ return null; } };
const PLAY = "M7 4.5v15l13-7.5z", PAUSE = "M6 4h4v16H6zM14 4h4v16h-4z";
const SVGNS = "http://www.w3.org/2000/svg";

/* idiomas */
Object.keys(UI).forEach(code => {
  const b = document.createElement("button");
  b.className = "lang"; b.textContent = UI[code].name; b.lang = code; b.dataset.lang = code;
  b.addEventListener("click", () => setLang(code));
  $("langs").appendChild(b);
});

/* rosa */
function buildRose(){
  const s = $("rose"); s.innerHTML = "";
  const C = 300, R = 215;
  const el = (n, a) => { const e = document.createElementNS(SVGNS, n); for (const k in a) e.setAttribute(k, a[k]); return e; };
  const g0 = el("g", {"aria-hidden":"true", "pointer-events":"none"});
  // rumbos
  for (let i = 0; i < 32; i++){ const a = i * Math.PI / 16; g0.appendChild(el("line",{x1:C,y1:C,x2:C+290*Math.cos(a),y2:C+290*Math.sin(a),stroke:"#5A4630","stroke-width":i%4?0.6:1.2,opacity:i%4?.35:.6})); }
  g0.appendChild(el("circle",{cx:C,cy:C,r:118,fill:"none",stroke:"#B8862B","stroke-width":2}));
  g0.appendChild(el("circle",{cx:C,cy:C,r:108,fill:"none",stroke:"#5A4630","stroke-width":1,"stroke-dasharray":"3 5"}));
  // estrella de 8 puntas
  const star = (len, w, rot, fillA, fillB) => {
    for (let i = 0; i < 4; i++){
      const a = rot + i * Math.PI/2;
      const tip = [C+len*Math.cos(a), C+len*Math.sin(a)];
      const l = [C+w*Math.cos(a-Math.PI/2), C+w*Math.sin(a-Math.PI/2)];
      const r = [C+w*Math.cos(a+Math.PI/2), C+w*Math.sin(a+Math.PI/2)];
      g0.appendChild(el("polygon",{points:`${C},${C} ${tip} ${l}`,fill:fillA,stroke:"#2E1E10","stroke-width":1}));
      g0.appendChild(el("polygon",{points:`${C},${C} ${tip} ${r}`,fill:fillB,stroke:"#2E1E10","stroke-width":1}));
    }
  };
  star(112, 20, Math.PI/4, "#E9D7AE", "#B8862B");
  star(140, 24, 0, "#8E2418", "#5E160E");
  g0.appendChild(el("circle",{cx:C,cy:C,r:46,fill:"#F8F0DE",stroke:"#2E1E10","stroke-width":2.5}));
  g0.appendChild(el("circle",{cx:C,cy:C,r:40,fill:"none",stroke:"#B8862B","stroke-width":1.5}));
  const t = el("text",{x:C,y:C+8,"text-anchor":"middle","font-family":"Cinzel, serif","font-weight":"900","font-size":"22",fill:"#8E2418"}); t.textContent = "CÁDIZ"; g0.appendChild(t);
  s.appendChild(g0);
  // nodos
  MARKETS.forEach(m => {
    const a = m.ang * Math.PI/180, x = C + R*Math.cos(a), y = C + R*Math.sin(a);
    const g = el("g",{class:"node" + (m.id==="indias"?" indias":""), tabindex:"0", role:"button", "data-id":m.id});
    if (m.id === "indias"){ g0.appendChild(el("path",{d:`M${C-50},${C} L${x+52},${y}`,stroke:"#2F5E8C","stroke-width":2,"stroke-dasharray":"6 5",fill:"none"})); }
    g.appendChild(el("circle",{cx:x,cy:y,r:52}));
    const words = m[lang][1].split(" ");
    const lines = []; let line = "";
    words.forEach(w => { if ((line + " " + w).trim().length > 10 && line){ lines.push(line); line = w; } else line = (line + " " + w).trim(); });
    lines.push(line);
    lines.forEach((ln, i) => { const tx = el("text",{x:x, y:y + 5 + (i - (lines.length-1)/2)*17, "text-anchor":"middle"}); tx.textContent = ln; g.appendChild(tx); });
    g.setAttribute("aria-label", m[lang][0]);
    const pick = () => showMarket(m.id);
    g.addEventListener("click", pick);
    g.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " "){ e.preventDefault(); pick(); }});
    s.appendChild(g);
  });
}
function showMarket(id){
  document.querySelectorAll("#rose .node").forEach(n => n.classList.toggle("on", n.dataset.id === id));
  const m = MARKETS.find(x => x.id === id);
  $("market").innerHTML = "";
  const b = document.createElement("b"); const p = document.createElement("p");
  if (m){ b.textContent = m[lang][0]; p.textContent = m[lang][2]; }
  else { p.textContent = UI[lang].marketDefault; }
  $("market").append(b, p);
}

/* capítulos */
function buildChapters(){
  const box = $("chapters"); box.innerHTML = "";
  DATA[lang].forEach((c, i) => {
    const art = document.createElement("article");
    art.className = "card chap"; art.id = "c" + i;
    const head = document.createElement("div"); head.className = "chead";
    const seal = document.createElement("span"); seal.className = "seal"; seal.setAttribute("aria-hidden","true"); seal.textContent = c.n || (i === 0 ? "◆" : "✦");
    const tt = document.createElement("div"); tt.className = "ctitle";
    const h = document.createElement("h3"); h.textContent = c.h;
    const d = document.createElement("span"); d.textContent = fmt(c.d);
    tt.append(h, d);
    const btn = document.createElement("button"); btn.className = "cplay"; btn.setAttribute("aria-label", UI[lang].chplay + ": " + c.h);
    btn.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="' + PLAY + '"/></svg>';
    btn.addEventListener("click", () => { if (cur === i){ toggle(); } else { playChapter(i, true); } });
    head.append(seal, tt, btn);
    const bar = document.createElement("div"); bar.className = "cbar"; bar.innerHTML = "<i></i>";
    const p = document.createElement("p"); p.className = "txt"; p.textContent = c.p;
    art.append(head, bar, p);
    box.appendChild(art);
  });
}

/* reproducción */
function playChapter(i, scroll){
  if (i < 0 || i >= DATA[lang].length) return;
  cur = i;
  audio.src = DATA[lang][i].f;
  audio.playbackRate = rate;
  audio.play().catch(() => {});
  markActive(scroll);
}
function toggle(){
  if (cur < 0){ playChapter(0, true); return; }
  audio.paused ? audio.play().catch(()=>{}) : audio.pause();
}
function markActive(scroll){
  document.querySelectorAll(".chap").forEach((a, i) => {
    a.classList.toggle("active", i === cur);
    const path = a.querySelector(".cplay path");
    path.setAttribute("d", i === cur && !audio.paused ? PAUSE : PLAY);
    if (i !== cur) a.querySelector(".cbar i").style.width = "0";
  });
  const c = DATA[lang][cur];
  $("nowlbl").textContent = cur >= 0 ? UI[lang].now + " " + (cur + 1) + "/" + DATA[lang].length + " ·" : "";
  $("nowtitle").textContent = cur >= 0 ? c.h : UI[lang].nowNone;
  if (scroll && cur >= 0){ const el = $("c" + cur); if (el) el.scrollIntoView({block:"center"}); }
}
function updatePlay(){
  const playing = !audio.paused;
  $("playicon").setAttribute("d", playing ? PAUSE : PLAY);
  $("play").setAttribute("aria-label", playing ? UI[lang].pause : UI[lang].play);
  if (cur >= 0){ const p = document.querySelector("#c" + cur + " .cplay path"); if (p) p.setAttribute("d", playing ? PAUSE : PLAY); }
}
audio.addEventListener("play", updatePlay);
audio.addEventListener("pause", updatePlay);
audio.addEventListener("ended", () => { if (cur < DATA[lang].length - 1) playChapter(cur + 1, true); else updatePlay(); });
audio.addEventListener("loadedmetadata", () => { $("dur").textContent = fmt(audio.duration); $("status").textContent = ""; });
audio.addEventListener("error", () => { if (audio.getAttribute("src")) $("status").textContent = UI[lang].missing; });
audio.addEventListener("timeupdate", () => {
  const d = audio.duration;
  $("cur").textContent = fmt(audio.currentTime);
  if (isFinite(d) && d > 0){
    if (!seeking) $("seek").value = Math.round(audio.currentTime / d * 1000);
    const bar = document.querySelector("#c" + cur + " .cbar i"); if (bar) bar.style.width = (audio.currentTime / d * 100) + "%";
  }
});
$("seek").addEventListener("input", e => { seeking = true; if (isFinite(audio.duration)) $("cur").textContent = fmt(e.target.value / 1000 * audio.duration); });
$("seek").addEventListener("change", e => { if (isFinite(audio.duration)) audio.currentTime = e.target.value / 1000 * audio.duration; seeking = false; });
$("play").addEventListener("click", toggle);
$("prev").addEventListener("click", () => { if (cur > 0 && audio.currentTime < 3) playChapter(cur - 1, true); else if (cur >= 0) audio.currentTime = 0; else playChapter(0, true); });
$("next").addEventListener("click", () => playChapter(Math.min(cur + 1, DATA[lang].length - 1), true));
$("playall").addEventListener("click", () => playChapter(0, true));
$("speed").addEventListener("click", () => {
  rate = RATES[(RATES.indexOf(rate) + 1) % RATES.length];
  audio.playbackRate = rate;
  $("speed").textContent = String(rate).replace(".", lang === "es" ? "," : ".") + "×";
});

/* volumen (iPhone/iPad no lo permiten desde una web) */
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function volOk(){ const b = audio.volume; audio.volume = 0.5; const ok = audio.volume === 0.5; audio.volume = b; return ok; }
if (isIOS || !volOk()){ $("volbox").hidden = true; $("volnote").hidden = false; }
$("vol").addEventListener("input", e => { audio.volume = +e.target.value; audio.muted = audio.volume === 0; updateMute(); });
$("mute").addEventListener("click", () => { audio.muted = !audio.muted; updateMute(); });
function updateMute(){
  $("muteicon").setAttribute("d", audio.muted ? "M4 9v6h4l5 4V5L8 9zM16 9l5 6M21 9l-5 6" : "M4 9v6h4l5 4V5L8 9zM16 8.5a5 5 0 0 1 0 7");
  $("mute").setAttribute("aria-label", audio.muted ? UI[lang].unmute : UI[lang].mute);
}
document.addEventListener("keydown", e => { if (e.code === "Space" && !/BUTTON|INPUT/.test(document.activeElement.tagName) && !document.activeElement.closest("#rose")){ e.preventDefault(); toggle(); } });

/* cambio de idioma */
function setLang(code){
  const wasPlaying = !audio.paused, keep = cur;
  lang = code; store("audioguia-lang", code);
  const U = UI[code];
  document.documentElement.lang = code;
  document.querySelectorAll(".lang").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === code)));
  $("langs").setAttribute("aria-label", U.group);
  $("subtitle").textContent = U.sub; $("playalltxt").textContent = U.playall;
  const tot = DATA[code].reduce((a, c) => a + c.d, 0);
  $("total").textContent = U.total + Math.round(tot / 60) + " " + U.min;
  $("rosetitle").textContent = U.rose; $("rosehint").textContent = U.rosehint;
  $("prev").setAttribute("aria-label", U.prev); $("next").setAttribute("aria-label", U.next);
  $("seek").setAttribute("aria-label", U.seek); $("speed").setAttribute("aria-label", U.speed); $("vol").setAttribute("aria-label", U.vol);
  $("volnote").textContent = U.volnote; $("dock").setAttribute("aria-label", U.now);
  $("byline").textContent = U.byline; $("course").textContent = U.course; $("credit").textContent = U.credit;
  $("speed").textContent = String(rate).replace(".", code === "es" ? "," : ".") + "×";
  buildRose(); showMarket(null); buildChapters(); updateMute();
  if (keep >= 0){ if (wasPlaying) playChapter(keep, false); else { cur = keep; audio.src = DATA[lang][keep].f; markActive(false); } }
  else markActive(false);
  updatePlay();
}
const saved = load("audioguia-lang");
const nav = (navigator.language || "es").slice(0,2);
setLang(saved && UI[saved] ? saved : (UI[nav] ? nav : "es"));
</script>
</body>
</html>
